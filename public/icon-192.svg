<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="#0F172A"/>
  
  <!-- Gradient accent -->
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  
  <!-- Speech bubble -->
  <rect x="28" y="32" width="136" height="100" rx="20" fill="url(#g)"/>
  <polygon points="60,132 80,132 50,160" fill="url(#g)"/>
  
  <!-- "EW" text -->
  <text x="96" y="98" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="60" fill="white" letter-spacing="-2">EW</text>
  
  <!-- Small briefcase icon -->
  <rect x="126" y="140" width="38" height="28" rx="5" fill="#34D399" stroke="#0F172A" stroke-width="3"/>
  <rect x="136" y="135" width="18" height="10" rx="4" fill="none" stroke="#34D399" stroke-width="3"/>
</svg>
