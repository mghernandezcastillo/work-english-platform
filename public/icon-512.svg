<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="#0F172A"/>
  
  <!-- Gradient accent -->
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  
  <!-- Speech bubble -->
  <rect x="74" y="85" width="364" height="268" rx="54" fill="url(#g)"/>
  <polygon points="160,353 214,353 134,428" fill="url(#g)"/>
  
  <!-- "EW" text -->
  <text x="256" y="262" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="160" fill="white" letter-spacing="-5">EW</text>
  
  <!-- Small briefcase icon -->
  <rect x="336" y="374" width="102" height="74" rx="14" fill="#34D399" stroke="#0F172A" stroke-width="8"/>
  <rect x="362" y="360" width="50" height="26" rx="10" fill="none" stroke="#34D399" stroke-width="8"/>
</svg>
