    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="English for Work" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />

    <!-- Facebook Domain Verification -->
    <meta name="facebook-domain-verification" content="0tp29o3tcsj7i1ud6chlj0ntijud5d" />

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1789279795363607');
      fbq('track', 'PageView');

      // Fire route-specific events inline (bypasses React bundle / SW cache)
      (function() {
        var path = window.location.pathname;
        var landingRoutes = ['/ingles-para-trabajo', '/ingles-call-center'];
        if (landingRoutes.indexOf(path) !== -1) {
          setTimeout(function() {
            fbq('track', 'ViewContent', {
              content_name: 'English for Work',
              content_type: 'product',
              currency: 'USD'
            });
          }, 500);
        }
      })();
    </script>

  </head>
  <body>
    <!-- Meta Pixel noscript fallback (must be in body, not head) -->
    <noscript>
      <img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=1789279795363607&ev=PageView&noscript=1"/>
    </noscript>

    <div id="root"></div>

    <!-- ═══ SERVICE WORKER RECOVERY ═══
         Runs BEFORE React. Detects stale SW, unregisters it,
         clears all caches, and reloads once for a clean slate.
         After first run, sets a flag so it becomes a no-op. -->
    <script>
      (function() {
        var RECOVERY_KEY = 'ew-sw-v2-clean';
        if (localStorage.getItem(RECOVERY_KEY)) return;

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            var hadOldSW = regs.length > 0;
            var promises = regs.map(function(r) { return r.unregister(); });
            Promise.all(promises).then(function() {
              if ('caches' in window) {
                caches.keys().then(function(names) {
                  names.forEach(function(n) { caches.delete(n); });
                });
              }
              localStorage.setItem(RECOVERY_KEY, '1');
              if (hadOldSW) {
                window.location.reload();
              }
            });
          });
        } else {
          localStorage.setItem(RECOVERY_KEY, '1');
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
